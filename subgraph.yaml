specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MarginalV1Factory
    network: berachain
    source:
      abi: MarginalV1Factory
      address: "0x0cF798FC6582938eaeE7a75EDf895e350E9b47e8"
      startBlock: 2648890
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LeverageEnabled
        - OwnerChanged
        - PoolCreated
      abis:
        - name: MarginalV1Factory
          file: ./abis/MarginalV1Factory.json
        - name: MarginalV1Pool
          file: ./abis/MarginalV1Pool.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ./abis/ERC20NameBytes.json
      eventHandlers:
        - event: OwnerChanged(indexed address,indexed address)
          handler: handleOwnerChanged
        - event: PoolCreated(indexed address,indexed address,uint24,indexed
            address,address)
          handler: handlePoolCreated
      file: ./src/factory.ts
  - kind: ethereum
    name: MarginalV1NonfungiblePositionManager
    network: berachain
    source:
      abi: MarginalV1NonfungiblePositionManager
      address: "0x7F91E7D76B18Ab17fC69d0c701B4c439b17abc57"
      startBlock: 2649709
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Mint
      abis:
        - name: MarginalV1NonfungiblePositionManager
          file: ./abis/MarginalV1NonfungiblePositionManager.json
      eventHandlers:
        - event: Mint(indexed uint256,address,indexed
            address,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleMint
        - event: Ignite(indexed uint256,indexed address,address,uint256,uint256)
          handler: handleIgnite
        - event: Lock(indexed uint256,indexed address,uint256)
          handler: handleLock
        - event: Free(indexed uint256,indexed address,address,uint256)
          handler: handleFree
      file: ./src/positionManager.ts
  - kind: ethereum
    name: MultiRewardsFactory
    network: berachain
    source:
      abi: MultiRewardsFactory
      address: "0x403117C583C035c7d37b29fE5ce664Ba792495e2"
      startBlock: 2648890
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AddReward
        - Deploy
        - NotifyRewardAmount
        - OwnershipTransferred
      abis:
        - name: MultiRewardsFactory
          file: ./abis/MultiRewardsFactory.json
        - name: MultiRewards
          file: ./abis/MultiRewards.json
        - name: MarginalV1Pool
          file: ./abis/MarginalV1Pool.json
      eventHandlers:
        - event: Deploy(indexed address,address)
          handler: handleStakePoolCreated
        - event: AddReward(indexed address,indexed address,uint256)
          handler: handleAddReward
      file: ./src/multiRewards.ts
templates:
  - kind: ethereum
    name: MarginalV1Pool
    network: berachain
    source:
      abi: MarginalV1Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Adjust
        - Approval
        - Burn
        - CollectProtocol
        - Initialize
        - Liquidate
        - Mint
        - Open
        - SetFeeProtocol
        - Settle
        - Swap
        - Transfer
      abis:
        - name: MarginalV1Pool
          file: ./abis/MarginalV1Pool.json
        - name: MarginalV1Factory
          file: ./abis/MarginalV1Factory.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Adjust(indexed address,indexed uint256,address,uint256)
          handler: handleAdjust
        - event: Liquidate(indexed address,indexed
            uint256,address,uint128,uint160,uint256)
          handler: handleLiquidate
        - event: Open(address,indexed address,indexed uint256,uint128,uint160,uint128)
          handler: handleOpen
        - event: Settle(indexed address,indexed
            uint256,address,uint128,uint160,int256,int256,uint256)
          handler: handleSettle
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
      file: ./src/pool.ts
  - kind: ethereum
    name: MultiRewards
    network: berachain
    source:
      abi: MultiRewards
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MultiRewardsOwnershipTransferred
        - RewardAdded
        - RewardPaid
        - Staked
        - Withdrawn
      abis:
        - name: MultiRewards
          file: ./abis/MultiRewards.json
        - name: MarginalV1Pool
          file: ./abis/MarginalV1Pool.json
      file: ./src/multiRewards.ts
