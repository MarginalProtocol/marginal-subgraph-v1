specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MarginalV1Factory
    network: mainnet
    source:
      address: "0x95D95C41436C15b50217Bf1C0f810536AD181C13"
      abi: MarginalV1Factory
      startBlock: 20297876
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LeverageEnabled
        - OwnerChanged
        - PoolCreated
      abis:
        - name: MarginalV1Factory
          file: ./abis/MarginalV1Factory.json
        - name: MarginalV1Pool
          file: ./abis/MarginalV1Pool.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ./abis/ERC20NameBytes.json
      eventHandlers:
        # - event: LeverageEnabled(uint24,uint256)
        - event: OwnerChanged(indexed address,indexed address)
          handler: handleOwnerChanged
        - event: PoolCreated(indexed address,indexed address,uint24,indexed address,address)
          handler: handlePoolCreated
      file: ./src/factory.ts

  - kind: ethereum
    # v1.0.3
    name: MarginalV1NonfungiblePositionManager_v1_0_3
    network: mainnet
    source:
      address: "0x273Fb953a410126436F252a86a98c9eff4d2C780"
      abi: MarginalV1NonfungiblePositionManager_v1_0_3
      startBlock: 20297876
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Mint
      abis:
        - name: MarginalV1NonfungiblePositionManager_v1_0_3
          file: ./abis/MarginalV1NonfungiblePositionManager_v1_0_3.json
      eventHandlers:
        - event: Mint(indexed uint256,address,indexed address,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleMint
        - event: Ignite(indexed uint256,indexed address,address,uint256,uint256)
          handler: handleIgnite
      file: ./src/positionManager.ts

  - kind: ethereum
    # v1.0.4
    name: MarginalV1NonfungiblePositionManager_v1_0_4
    network: mainnet
    source:
      address: "0xd8Be1B2571B7c43B77FF3aE87BC6F0A23Fa224B8"
      abi: MarginalV1NonfungiblePositionManager_v1_0_4
      startBlock: 21138323
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Mint
      abis:
        - name: MarginalV1NonfungiblePositionManager_v1_0_4
          file: ./abis/MarginalV1NonfungiblePositionManager_v1_0_4.json
      eventHandlers:
        - event: Mint(indexed uint256,address,indexed address,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleMint
        - event: Ignite(indexed uint256,indexed address,address,uint256,uint256)
          handler: handleIgnite
      file: ./src/positionManager.ts

  - kind: ethereum
    name: MultiRewardsFactory
    network: mainnet
    source:
      address: "0x7120D5FC29BE09b0b86a939D80F096D8Cbf75aFf"
      abi: MultiRewardsFactory
      startBlock: 20557974
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AddReward
        - Deploy
        - NotifyRewardAmount
        - OwnershipTransferred
      abis:
        - name: MultiRewardsFactory
          file: ./abis/MultiRewardsFactory.json
        - name: MultiRewards
          file: ./abis/MultiRewards.json
      eventHandlers:
        # - event: AddReward(indexed address,indexed address,uint256)
        #   handler: handleAddReward
        - event: Deploy(indexed address,address)
          handler: handleStakePoolCreated
        # - event: NotifyRewardAmount(indexed address,indexed address,uint256)
        #   handler: handleNotifyRewardAmount
        # - event: OwnershipTransferred(indexed address,indexed address)
        #   handler: handleOwnershipTransferred
      file: ./src/stake.ts

templates:
  - kind: ethereum
    name: MarginalV1Pool
    network: mainnet
    source:
      abi: MarginalV1Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Adjust
        - Approval
        - Burn
        - CollectProtocol
        - Initialize
        - Liquidate
        - Mint
        - Open
        - SetFeeProtocol
        - Settle
        - Swap
        - Transfer
      abis:
        - name: MarginalV1Pool
          file: ./abis/MarginalV1Pool.json
        - name: MarginalV1Factory
          file: ./abis/MarginalV1Factory.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Adjust(indexed address,indexed uint256,address,uint256)
          handler: handleAdjust
        # - event: Approval(indexed address,indexed address,uint256)
        #   handler: handleApproval
        # - event: Burn(indexed address,address,uint128,uint256,uint256)
        #   handler: handleBurn
        # - event: CollectProtocol(address,indexed address,uint128,uint128)
        #   handler: handleCollectProtocol
        # - event: Initialize(uint160,int24)
        #   handler: handleInitialize
        - event: Liquidate(indexed address,indexed uint256,address,uint128,uint160,uint256)
          handler: handleLiquidate
        # - event: Mint(address,indexed address,uint128,uint256,uint256)
        #   handler: handleMint
        - event: Open(address,indexed address,indexed uint256,uint128,uint160,uint128)
          handler: handleOpen
        # - event: SetFeeProtocol(uint8,uint8)
        #   handler: handleSetFeeProtocol
        - event: Settle(indexed address,indexed uint256,address,uint128,uint160,int256,int256,uint256)
          handler: handleSettle
        # - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
        #   handler: handleSwap
        # - event: Transfer(indexed address,indexed address,uint256)
        #   handler: handleTransfer
      file: ./src/pool.ts
  - kind: ethereum
    name: MultiRewards
    network: mainnet
    source:
      abi: MultiRewards
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MultiRewardsOwnershipTransferred
        - RewardAdded
        - RewardPaid
        - Staked
        - Withdrawn
      abis:
        - name: MultiRewards
          file: ./abis/MultiRewards.json
      eventHandlers:
        # - event: OwnershipTransferred(indexed address,indexed address)
        #   handler: handleOwnershipTransferred
        - event: RewardAdded(uint256)
          handler: handleRewardAdded
        # - event: RewardPaid(indexed address,indexed address,uint256)
        #   handler: handleRewardPaid
        # - event: Staked(indexed address,uint256)
        #   handler: handleStaked
        # - event: Withdrawn(indexed address,uint256)
        #   handler: handleWithdrawn
      file: ./src/stake.ts
